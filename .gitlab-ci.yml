stages:
  - build
  - extract
  - release

variables:
  # Kaniko layer cache stored in the project registry
  CACHE_IMAGE: $CI_REGISTRY_IMAGE:buildcache
  # Full image tag for this commit
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

# ── Build ──────────────────────────────────────────────────────────────────────
# Uses Kaniko — builds and pushes the Docker image without a Docker daemon,
# so no privileged mode or docker:dind service is needed.
build:
  stage: build
  tags:
    - amd64
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    # Write registry credentials into the location Kaniko expects
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" \
        > /kaniko/.docker/config.json
    # Build and push — Kaniko uses the registry as a layer cache automatically
    - |
      /kaniko/executor \
        --context   "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --destination "${IMAGE}" \
        --cache=true \
        --cache-repo  "${CACHE_IMAGE}"

# ── Extract ────────────────────────────────────────────────────────────────────
# Uses crane to pull only the binary out of the image that was just pushed,
# without needing a Docker daemon or privileged mode.
extract:
  stage: extract
  tags:
    - amd64
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Export the image filesystem as a tar stream, then pull out just the binary.
    # /app/automail_ui inside the image → app/automail_ui in the tar → ./automail_ui here.
    - crane export "${IMAGE}" - | tar --strip-components=1 -xf - app/automail_ui
  artifacts:
    name: "automail_ui-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - automail_ui
    expire_in: 30 days

# ── Release (tags only) ────────────────────────────────────────────────────────
# Creates a GitLab Release and attaches the binary whenever a version tag is pushed.
release:
  stage: release
  tags:
    - amd64
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG        # only runs on git tags, e.g. v1.2.3
  needs:
    - job: extract
      artifacts: true           # pulls the binary from the extract job
  before_script:
    # Upload the binary as a Generic Package so it can be linked in the release
    - |
      curl --fail \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file automail_ui \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/automail_ui/${CI_COMMIT_TAG}/automail_ui"
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Automail UI $CI_COMMIT_TAG"
    description: "Automated release for $CI_COMMIT_TAG"
    assets:
      links:
        - name: "automail_ui (Linux x86_64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/automail_ui/${CI_COMMIT_TAG}/automail_ui"
          link_type: package
