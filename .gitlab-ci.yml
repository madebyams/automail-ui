stages:
  - prepare
  - test
  - build
  - extract
  - release

variables:
  CACHE_IMAGE: $CI_REGISTRY_IMAGE:buildcache
  IMAGE:       $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

# ── Shared config ──────────────────────────────────────────────────────────────
.kaniko:
  tags: [amd64]
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" \
        > /kaniko/.docker/config.json

.mingw:
  tags: [amd64]
  timeout: 3h
  image: git.anothersimplecoder.de:5050/anothersimplecoder/dev-containers/x86_64-w64-mingw32
  variables:
    CONAN_HOME: '$CI_PROJECT_DIR/.conan'
  cache:
    key: conan-windows-v1
    paths:
      - .conan/p/
  before_script:
    # Build profile: native Linux GCC (used to run build tools)
    - conan profile detect --force
    - sed -i 's/compiler.cppstd=[a-z0-9]*/compiler.cppstd=20/' "$CONAN_HOME/profiles/default"
    # conan_provider.cmake bases the host profile on 'default', so options
    # that must survive the CMake build step must live in the default profile.
    - |
      printf '\n[options]\n' >> "$CONAN_HOME/profiles/default"
      for opt in cobalt context contract coroutine fiber graph json locale log math nowide process serialization stacktrace test type_erasure url wave; do
        printf "boost/*:without_${opt}=True\n" >> "$CONAN_HOME/profiles/default"
      done
      printf "boost/*:extra_b2_flags=define=_WIN32_WINNT=0x0601\n" >> "$CONAN_HOME/profiles/default"
    # Host profile: Windows target via MinGW cross-compiler
    - |
      MINGW_VER=$(x86_64-w64-mingw32-g++-posix -dumpversion | sed 's/[^0-9].*//')
      cat > "$CONAN_HOME/profiles/windows-mingw" <<EOF
      [settings]
      os=Windows
      arch=x86_64
      compiler=gcc
      compiler.version=$MINGW_VER
      compiler.cppstd=20
      compiler.libcxx=libstdc++11

      [options]
      boost/*:without_cobalt=True
      boost/*:without_context=True
      boost/*:without_contract=True
      boost/*:without_coroutine=True
      boost/*:without_fiber=True
      boost/*:without_graph=True
      boost/*:without_json=True
      boost/*:without_locale=True
      boost/*:without_log=True
      boost/*:without_math=True
      boost/*:without_nowide=True
      boost/*:without_process=True
      boost/*:without_serialization=True
      boost/*:without_stacktrace=True
      boost/*:without_test=True
      boost/*:without_type_erasure=True
      boost/*:without_url=True
      boost/*:without_wave=True
      boost/*:extra_b2_flags=define=_WIN32_WINNT=0x0601

      [buildenv]
      CC=x86_64-w64-mingw32-gcc-posix
      CXX=x86_64-w64-mingw32-g++-posix
      RC=x86_64-w64-mingw32-windres
      AR=x86_64-w64-mingw32-ar
      STRIP=x86_64-w64-mingw32-strip
      EOF
    - conan create webview-recipe/ --version 0.12.0 --build=missing
        --profile:build=default --profile:host=windows-mingw --test-folder=""

# ─────────────────────────── FRONTEND (all commits) ───────────────────────────

build-frontend:
  stage: prepare
  tags: [amd64]
  image: node:lts-alpine
  rules:
    - when: always
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 day

# ─────────────────────────── TESTS (all commits) ─────────────────────────────

test-frontend:
  stage: test
  tags: [amd64]
  image: node:lts-alpine
  rules:
    - when: always
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run test -- --run

test-backend:
  stage: test
  tags: [amd64]
  image: conanio/gcc13:latest
  variables:
    CONAN_HOME: '$CI_PROJECT_DIR/.conan'
  cache:
    key: conan-linux-test-v1
    paths:
      - .conan/p/
  rules:
    - when: always
  before_script:
    - conan profile detect --force
    - sed -i 's/compiler.cppstd=[a-z0-9]*/compiler.cppstd=20/' "$CONAN_HOME/profiles/default"
  script:
    - |
      cmake -S . -B build \
        "-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=conan_provider.cmake" \
        -DCMAKE_BUILD_TYPE=Debug \
        -DBUILD_MAIN_APP=OFF
    - cmake --build build --target backend_tests
    - ctest --test-dir build --output-on-failure

# ─────────────────────────── DEBUG BUILDS (all non-tag commits) ───────────────

build-linux:
  extends: .kaniko
  stage: build
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  script:
    - |
      /kaniko/executor \
        --context           "${CI_PROJECT_DIR}" \
        --dockerfile        "${CI_PROJECT_DIR}/Dockerfile" \
        --build-arg         "BUILD_TYPE=Debug" \
        --no-push \
        --cache=true \
        --cache-repo        "${CACHE_IMAGE}" \
        --snapshot-mode=redo \
        --compressed-caching=false \
        --single-snapshot

build-windows:
  extends: .mingw
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  needs:
    - job: build-frontend
      artifacts: true
    - job: test-frontend
    - job: test-backend
  script:
    - |
      cmake -S . -B build \
        "-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=conan_provider.cmake" \
        -DCMAKE_BUILD_TYPE=Debug \
        -DCMAKE_SYSTEM_NAME=Windows \
        -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc-posix \
        -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix \
        -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
        -G "Unix Makefiles"
    - cmake --build build

# ─────────────────────────── RELEASE BUILDS (tags only) ───────────────────────

build-release-linux:
  extends: .kaniko
  stage: build
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      /kaniko/executor \
        --context           "${CI_PROJECT_DIR}" \
        --dockerfile        "${CI_PROJECT_DIR}/Dockerfile" \
        --build-arg         "BUILD_TYPE=Release" \
        --destination       "${IMAGE}" \
        --cache=true \
        --cache-repo        "${CACHE_IMAGE}" \
        --snapshot-mode=redo \
        --compressed-caching=false \
        --single-snapshot

build-release-windows:
  extends: .mingw
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build-frontend
      artifacts: true
    - job: test-frontend
    - job: test-backend
  script:
    - |
      cmake -S . -B build \
        "-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=conan_provider.cmake" \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_SYSTEM_NAME=Windows \
        -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc-posix \
        -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix \
        -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
        -G "Unix Makefiles"
    - cmake --build build
    - cp build/src/main/automailer_ui.exe automail-ui-${CI_COMMIT_TAG}-win64.exe
  artifacts:
    name: "automail-ui-$CI_COMMIT_TAG-win64"
    paths:
      - automail-ui-*-win64.exe
    expire_in: 90 days

# ─────────────────────────── EXTRACT (tags only) ──────────────────────────────

extract-linux:
  stage: extract
  tags: [amd64]
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build-release-linux
  script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - crane export "${IMAGE}" - | tar --strip-components=1 -xf - app/automail_ui
  artifacts:
    name: "automail_ui-$CI_COMMIT_TAG-linux"
    paths:
      - automail_ui
    expire_in: 90 days

extract-windows:
  stage: extract
  tags: [amd64]
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build-release-windows
      artifacts: true
  script:
    - ls automail-ui-*-win64.exe
  artifacts:
    name: "automail-ui-$CI_COMMIT_TAG-win64"
    paths:
      - automail-ui-*-win64.exe
    expire_in: 90 days

# ─────────────────────────── RELEASE (tags only) ──────────────────────────────

release:
  stage: release
  tags: [amd64]
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: extract-linux
      artifacts: true
    - job: extract-windows
      artifacts: true
  script:
    # Upload Linux binary
    - |
      curl --fail --request PUT \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file automail_ui \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/automail_ui/${CI_COMMIT_TAG}/automail_ui"
    # Upload Windows binary
    - INSTALLER=$(ls automail-ui-*-win64.exe | head -1)
    - |
      curl --fail --request PUT \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "${INSTALLER}" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/automail_ui/${CI_COMMIT_TAG}/automail-ui-win64.exe"
    # Delete existing release if present (ignore errors), then create fresh
    - |
      curl --request DELETE \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}" || true
    - |
      curl --fail --request POST \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --header "Content-Type: application/json" \
           --data "{\"tag_name\":\"${CI_COMMIT_TAG}\",\"name\":\"Automail UI ${CI_COMMIT_TAG}\",\"description\":\"Automated release for ${CI_COMMIT_TAG}\"}" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
    # Attach Linux binary
    - |
      curl --fail --request POST \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --header "Content-Type: application/json" \
           --data "{\"name\":\"automail_ui (Linux x86_64)\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/automail_ui/${CI_COMMIT_TAG}/automail_ui\",\"link_type\":\"package\"}" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"
    # Attach Windows binary
    - |
      curl --fail --request POST \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --header "Content-Type: application/json" \
           --data "{\"name\":\"Automail UI (Windows x64)\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/automail_ui/${CI_COMMIT_TAG}/automail-ui-win64.exe\",\"link_type\":\"package\"}" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"
