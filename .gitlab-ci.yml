stages:
  - build
  - extract
  - release

variables:
  # Kaniko layer cache stored in the project registry
  CACHE_IMAGE: $CI_REGISTRY_IMAGE:buildcache
  # Full image tag for this commit (used by the release pipeline)
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

# ── Build – all non-tag commits (Debug, no push) ───────────────────────────────
# Verifies the code compiles on every branch push without publishing an image.
build:
  stage: build
  tags:
    - amd64
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  script:
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" \
        > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context           "${CI_PROJECT_DIR}" \
        --dockerfile        "${CI_PROJECT_DIR}/Dockerfile" \
        --build-arg         "BUILD_TYPE=Debug" \
        --no-push \
        --cache=true \
        --cache-repo        "${CACHE_IMAGE}" \
        --snapshot-mode=redo \
        --compressed-caching=false \
        --single-snapshot

# ── Build Release – tags only (Release, pushes image) ─────────────────────────
build-release:
  stage: build
  tags:
    - amd64
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" \
        > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context           "${CI_PROJECT_DIR}" \
        --dockerfile        "${CI_PROJECT_DIR}/Dockerfile" \
        --build-arg         "BUILD_TYPE=Release" \
        --destination       "${IMAGE}" \
        --cache=true \
        --cache-repo        "${CACHE_IMAGE}" \
        --snapshot-mode=redo \
        --compressed-caching=false \
        --single-snapshot

# ── Extract – tags only ────────────────────────────────────────────────────────
# Pulls the Release binary out of the image without a Docker daemon.
extract:
  stage: extract
  tags:
    - amd64
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build-release
  script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Export image filesystem as a tar stream, extract just the binary.
    # /app/automail_ui inside the image → app/automail_ui in the tar → ./automail_ui here.
    - crane export "${IMAGE}" - | tar --strip-components=1 -xf - app/automail_ui
  artifacts:
    name: "automail_ui-$CI_COMMIT_TAG"
    paths:
      - automail_ui
    expire_in: 90 days

# ── Release – tags only ────────────────────────────────────────────────────────
# Uploads the binary as a Generic Package and creates a GitLab Release entry.
release:
  stage: release
  tags:
    - amd64
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: extract
      artifacts: true
  before_script:
    - |
      curl --fail --request PUT \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file automail_ui \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/automail_ui/${CI_COMMIT_TAG}/automail_ui"
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Automail UI $CI_COMMIT_TAG"
    description: "Automated release for $CI_COMMIT_TAG"
    assets:
      links:
        - name: "automail_ui (Linux x86_64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/automail_ui/${CI_COMMIT_TAG}/automail_ui"
          link_type: package
